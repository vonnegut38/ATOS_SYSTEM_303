# FLASHBK.APP settings (ATOS).  true/false, one option per line.
# Polygon cutscenes: off in the test build (CPU heavy, need *.CMD/*.POL).
skip_cutscenes=true
# Joystick fire button: shift (run/shoot/act), space (draw/holster gun), enter (use item).
joy_fire=shift
bypass_protection=true
enable_password_menu=true
fade_out_palette=true
