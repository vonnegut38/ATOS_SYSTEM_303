; ATOS desktop launcher - one entry per line: LABEL=path
; path is a full application path, or *TERMINAL / *TRASH for builtins.
; The bar sits at the bottom of the desktop; entries that do not fit are hidden.
COMMANDER=\SYSTEM\APP\AC.APP
TERMINAL=*TERMINAL
SYSINFO=\SYSTEM\APP\SYSINFO.APP
TRASH=*TRASH
TASKMGR=\SYSTEM\APP\TASKMGR.APP
PLASMA=\SYSTEM\APP\PLASMA.APP
ARKANOID=\SYSTEM\APP\ARKANOID.APP
